# 参考样例：在**一台** Linux 机器上于 2026-09-14 录制的真实指纹。
#
# 它是真的，不是占位符——可以直接看出真浏览器与脚本客户端的 ja3_string
# 差别有多大（Chromium 的密码套件明显更少、扩展顺序也不同，这正是 L2 判定
# 的依据）。
#
# 但**不要直接拿它当你的指纹集用**：你机器上的 Chromium / curl / OpenSSL
# 版本一旦不同，JA3 就对不上，真浏览器会被判为"不在白名单"。
# 录你自己的：
#
#     cd range && python -m tools.record_fingerprints --out fingerprints/local.yaml
#
# 然后在 profile 里把 fingerprints 改成 builtin:local。
#
# ⚠️ JA3 随客户端版本变化。过期的指纹会让真浏览器也被判为不在白名单，
#    L2 的结果因此系统性偏高，症状还是"偶尔拦错人"。
#    每条都带了录制时的版本号——换机器或升级客户端后请重录。

# ja3 -> 客户端名。命中即判定为脚本库，不看强度档。
script_clients:
  # python-urllib / OpenSSL 3.6.4 25 Aug 2026
  # ja3_string: 771,4866-4867-4865-49196-49200-49195-49199-52393-52392-49188-49192-49187-49191-159-158-107-103,65281-11-10-35-22-23-13-43-45-51-27,4588-29-23-30-24-25-256-257,0
  e13a080178d6052cad07cde7ba6232d0: "python-urllib"

  # curl 8.22.0 (x86_64-pc-linux-gnu) libcurl/8.22.0 OpenSSL/3.6.4 zlib/1.3.1.zlib-n
  # ja3_string: 771,4866-4867-4865-49196-49200-159-52393-52392-52394-49195-49199-158-49188-49192-107-49187-49191-103-49162-49172-57-49161-49171-51-157-156-61-60-53-47,65281-11-10-16-22-23-49-13-43-45-51-27,4588-29-23-30-24-25-256-257,0
  cd911cdb3ae1af6c7bc940cdcad83a1a: "curl"

  # node v26.8.1
  # ja3_string: 771,4866-4867-4865-49199-49195-49200-49196-158-49191-103-49192-107-163-159-52393-52392-52394-49325-49311-49245-49249-49239-49235-162-49324-49310-49244-49248-49238-49234-49188-106-49187-64-49162-49172-57-56-49161-49171-51-50-157-49309-49233-156-49308-49232-61-60-53-47,65281-11-10-35-22-23-13-43-45-51,4588-29-23-30-24-25-256-257,0
  74fc12d4399034848f23564f342e65b9: "node-https"

# ja3 -> 浏览器族。strict 档要求命中本表；paranoid 档还要求与 UA 一致。

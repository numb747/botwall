[project]
name = "botwall-range"
version = "0.1.0"
description = "botwall 靶场：可逐层开关的反自动化防御复现实现"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# L6 的 static_image 题型需要图像渲染。
#   pip install -e "range[captcha]"
captcha = ["pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "tlsfront*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: 端到端测试，会启动真实服务（较慢）。跳过用 -m 'not e2e'",
]

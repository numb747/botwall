[project]
name = "botwall-harness"
version = "0.1.0"
description = "botwall harness：强制计量的采集成本阶梯扫描"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    # 靶场本身。harness 需要它的 verify_record 来分辨真值与投毒数据，
    # 也需要启动它作为被测对象。
    "botwall-range",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# browser 攻击实现需要 playwright。装法：
#   pip install -e "harness[browser]" && playwright install chromium
browser = ["playwright>=1.40"]

[project.scripts]
botwall = "botwall_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["botwall_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: 端到端测试，会真的启动靶场进程（较慢）。跳过用 -m 'not e2e'",
]

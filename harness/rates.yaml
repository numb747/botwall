# CostLadder 价格表
#
# ⚠️ 下面全部是**先验估计**，不是实测行情。它们决定输出的绝对数值，因此
#    任何对外引用的结果都必须同时附上所用的价格表版本，否则不可比。
#
# 换成你自己的实际采购价再跑一遍，结论的绝对值才对你有意义。
# 相对倍数（阶梯各级之间的比值）对价格表的敏感度低得多，通常更稳健。

version: 1
currency: USD

# --- 代理 ---
# 按流量计费，所以代理成本由**每请求字节数**决定，而不是请求数。
# 推论：浏览器方案的代理成本远高于 HTTP 方案，因为它会拉 JS/CSS/图片/字体
# 一整套资源。同一个页面纯 HTTP 取 30 KB、浏览器取 3 MB，账单差 100 倍。
proxy_usd_per_gb:
  none: 0.0          # 直连，用于本地基线
  datacenter: 0.05
  residential: 4.00
  mobile: 10.00

# --- 算力 ---
# 按攻击进程自己消耗的 CPU 时间计价，不按墙钟——墙钟里混着计量代理的开销。
compute_usd_per_cpu_hour: 0.04

# --- 求解 ---
# 人工打码平台的行情。这是整个模型里的**价格地板**：
# 任何自动化方案，如果单次成本高于它，在经济上就没有存在理由。
solve_usd_per_1k:
  human_farm: 1.50

# --- 开发 ---
# 用于把申报的逆向工时折算成钱。注意 A_dev 永远与实测成本分开上报。
dev_usd_per_hour: 40.00

# --- 摊销场景 ---
# A_dev 的摊销期由**目标站的改版频率**决定，不是由项目周期决定。
amortization:
  annual_records: 10000000   # 年采集量，条
  revisions_per_year: 4      # 目标站年改版次数，每次都要重做逆向
